# Publishes frontend/dist to GitHub Pages. Manual only (workflow_dispatch); it works only if the repository is PUBLIC and
# Pages is enabled in Settings → Pages → Source: "GitHub Actions". The site uses relative paths (base "./"),
# so it works at https://<user>.github.io/<repo>/ without setting VITE_BASE.
name: pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build   # no VITE_LLM_URL or VITE_API_URL: static site, assistant in Basic mode
        working-directory: frontend
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
