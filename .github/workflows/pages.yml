# Publica frontend/dist en GitHub Pages. Solo manual (workflow_dispatch) y solo sirve si el repo es PÚBLICO y
# Pages está activado en Settings → Pages → Source: "GitHub Actions". El sitio usa rutas relativas (base "./"),
# así que funciona en https://<usuario>.github.io/<repo>/ sin definir VITE_BASE.
name: pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build   # sin VITE_LLM_URL ni VITE_API_URL: sitio estático, asistente en modo Basic
        working-directory: frontend
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
