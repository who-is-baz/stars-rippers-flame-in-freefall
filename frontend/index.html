<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#040506" />
    <meta name="color-scheme" content="dark" />
    <script>
      // Apply the saved theme before the first paint (no flash). Dark unless the visitor chose Light; same keys as
      // src/lib/displayPrefs.ts. Storage errors leave the default (Dark).
      (function () {
        var d = document.documentElement, t = 'dark', c = null;
        try { t = localStorage.getItem('fif.theme') === 'light' ? 'light' : 'dark'; c = localStorage.getItem('fif.contrast'); } catch (e) {}
        var q = /[?&]theme=(dark|light)\b/.exec(location.search); if (q) t = q[1]; // ?theme=light for a demo link (not saved)
        d.setAttribute('data-theme', t);
        if (c === 'more' || (c === null && window.matchMedia && matchMedia('(prefers-contrast: more)').matches)) d.setAttribute('data-contrast', 'more');
        if (t === 'light') {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#ECEEF1');
          document.querySelector('meta[name="color-scheme"]').setAttribute('content', 'light');
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Flarefall (Flame in Freefall · NASA Space Apps 2026): NASA PSI microgravity combustion data, organised by atmosphere, with sources and stated gaps." />
    <title>Flarefall · Flame in Freefall · NASA Space Apps 2026</title>
    <meta name="application-name" content="Flarefall" />
    <meta property="og:title" content="Flarefall" />
    <meta property="og:description" content="Flame in Freefall · NASA Space Apps 2026" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="icon" href="./favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180">
    <link rel="manifest" href="./site.webmanifest">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
